<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">
<h:head>
    <title>Product Categories | SMB ERP</title>
    <h:outputStylesheet name="css/app.css"/>
</h:head>
<h:body>
    <main class="container">
        <header class="page-header">
            <h:link outcome="index" styleClass="back-link">Back to dashboard</h:link>
            <h1>Product Categories</h1>
            <p>Create, update, and remove product categories.</p>
        </header>
        <h:messages styleClass="messages"/>
        <section class="panel">
            <h2>Category records</h2>
            <h:form>
                <h:dataTable value="#{productCategoryController.items}" var="category"
                             styleClass="data-table" rowClasses="table-row">
                    <h:column><f:facet name="header">ID</f:facet>#{category.id}</h:column>
                    <h:column><f:facet name="header">Name</f:facet>#{category.name}</h:column>
                    <h:column><f:facet name="header">Description</f:facet>#{category.description}</h:column>
                    <h:column>
                        <f:facet name="header">Actions</f:facet>
                        <h:commandButton value="Edit"
                                         action="#{productCategoryController.select(category)}"
                                         styleClass="button button-secondary"/>
                        <h:commandButton value="Delete"
                                         action="#{productCategoryController.delete(category)}"
                                         styleClass="button button-danger"
                                         onclick="return confirm('Delete this category and its products?');"/>
                    </h:column>
                </h:dataTable>
            </h:form>
        </section>
        <section class="panel">
            <h2>#{productCategoryController.editing ? 'Update category' : 'Add category'}</h2>
            <h:form>
                <h:panelGrid columns="2" styleClass="form-grid">
                    <h:outputLabel for="name" value="Name"/>
                    <h:inputText id="name" value="#{productCategoryController.selected.name}"
                                 required="true"/>
                    <h:outputLabel for="description" value="Description"/>
                    <h:inputTextarea id="description"
                                     value="#{productCategoryController.selected.description}"
                                     required="true"/>
                </h:panelGrid>
                <h:commandButton value="#{productCategoryController.editing ? 'Update category' : 'Save category'}"
                                 action="#{productCategoryController.save}"
                                 styleClass="button button-primary"/>
            </h:form>
        </section>
    </main>
</h:body>
</html>
